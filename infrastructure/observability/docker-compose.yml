services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      SIEM_OTLP_ENDPOINT: ${SIEM_OTLP_ENDPOINT:?Set the SIEM OTLP endpoint in .env}
      SIEM_OTLP_AUTHORIZATION: ${SIEM_OTLP_AUTHORIZATION:?Set the SIEM authorization header in .env}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
