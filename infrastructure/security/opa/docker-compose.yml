services:
  opa:
    image: openpolicyagent/opa:1.8.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./policies:/policies:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
