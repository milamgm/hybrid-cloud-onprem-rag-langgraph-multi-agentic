services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    container_name: agentic_litellm_gateway
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    env_file: .env
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
