[project]
name = "onyx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.117.0",
    "langchain>=1.3.14",
    "langchain-azure-ai>=1.2.3",
    "langchain-classic>=1.0.8",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.1.11",
    "langchain-postgres>=0.0.17",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-redis>=0.5.1",
    "psycopg[binary]>=3.3.4",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "tiktoken>=0.13.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.16.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

# Pinned explicitly so lint results are identical on every machine and in CI,
# rather than depending on whatever global ruff config a developer happens to have.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "G",    # logging format
]
ignore = [
    "E501",  # Line length is handled by the formatter.
    "G004",  # f-strings in log calls: the codebase style, and these are not hot paths.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
